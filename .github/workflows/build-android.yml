name: Build Misfits Pack Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout Misfits Pack
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout GameAPI Dependency
        uses: actions/checkout@v4
        with:
          repository: RSDK-Reverse/GameAPI
          path: game-api-repo

      - name: Setup GameAPI Structure
        run: |
          mkdir -p project/GameAPI
          # Copia a pasta C (que contém a subpasta GameAPI) para dentro de project/GameAPI
          cp -r game-api-repo/C project/GameAPI/

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile with CMake
        run: |
          cd project
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MisfitsPack-${{ matrix.arch }}
          path: project/build/*.so
