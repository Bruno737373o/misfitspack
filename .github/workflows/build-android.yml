name: Build Misfits Pack Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout Misfits Pack
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout GameAPI (Bruno737373o)
        uses: actions/checkout@v4
        with:
          repository: Bruno737373o/RSDKv5-Decompilation
          path: mania-decomp

      - name: Setup GameAPI Structure
        run: |
          # Criar o caminho que o CMake do mod exige
          mkdir -p project/GameAPI/C/GameAPI
          
          # Procurar qualquer pasta chamada 'GameAPI' que contenha arquivos .c e .h
          # O repositório do Bruno tem em: mania-decomp/RSDKv5/GameAPI/C/GameAPI
          SOURCE_PATH="mania-decomp/RSDKv5/GameAPI/C/GameAPI"
          
          if [ -d "$SOURCE_PATH" ]; then
            cp -r $SOURCE_PATH/. project/GameAPI/C/GameAPI/
            echo "Arquivos copiados de $SOURCE_PATH"
          else
            # Plano B: Procura em qualquer lugar do repo ignorando maiúsculas/minúsculas
            SOURCE_PATH=$(find mania-decomp -iname "GameAPI" -type d | grep "C/GameAPI" | head -n 1)
            cp -r $SOURCE_PATH/. project/GameAPI/C/GameAPI/
            echo "Arquivos copiados via busca dinâmica de $SOURCE_PATH"
          fi
          
          # Verificação final obrigatória
          ls -l project/GameAPI/C/GameAPI/Game.c

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile with CMake
        run: |
          cd project
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MisfitsPack-${{ matrix.arch }}
          path: project/build/*.so
