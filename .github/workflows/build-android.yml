name: Build Misfits Pack Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Focando nas arquiteturas mais usadas em Android
        arch: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout Misfits Pack
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout GameAPI (Bruno737373o)
        uses: actions/checkout@v4
        with:
          repository: Bruno737373o/RSDKv5-Decompilation
          path: mania-decomp

      - name: Setup GameAPI Structure
        run: |
          # Criar a estrutura necessária para o CMakeLists.txt do mod
          mkdir -p project/GameAPI/C
          
          # No repositório RSDKv5-Decompilation, a GameAPI costuma estar na raiz ou em RSDKv5
          # Este comando tenta copiar de RSDKv5/GameAPI/C para a pasta do projeto
          if [ -d "mania-decomp/RSDKv5/GameAPI/C" ]; then
            cp -r mania-decomp/RSDKv5/GameAPI/C/GameAPI project/GameAPI/C/
          else
            cp -r mania-decomp/GameAPI/C/GameAPI project/GameAPI/C/
          fi
          
          # Verificação final para garantir que o CMake encontrará o arquivo
          if [ -f "project/GameAPI/C/GameAPI/Game.c" ]; then
            echo "GameAPI configurada com sucesso."
          else
            echo "ERRO: Game.c não encontrado. Verificando onde os arquivos estão..."
            find mania-decomp -name "Game.c"
            exit 1
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile with CMake
        run: |
          cd project
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MisfitsPack-Android-${{ matrix.arch }}
          path: project/build/*.so
