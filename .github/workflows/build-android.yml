name: Build Misfits Pack Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout Misfits Pack
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout GameAPI (Bruno737373o)
        uses: actions/checkout@v4
        with:
          repository: Bruno737373o/RSDKv5-Decompilation
          path: mania-decomp

      - name: Setup GameAPI Structure
        run: |
          mkdir -p project/GameAPI/C
          # Busca dinâmica pela pasta GameAPI
          API_SOURCE=$(find mania-decomp -type d -path "*/GameAPI/C/GameAPI" | head -n 1)
          if [ -n "$API_SOURCE" ]; then
            cp -r "$API_SOURCE" project/GameAPI/C/
            echo "GameAPI injetada com sucesso de: $API_SOURCE"
          else
            echo "Erro crítico: Estrutura GameAPI/C/GameAPI não encontrada."
            exit 1
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile with CMake
        run: |
          cd project
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MisfitsPack-${{ matrix.arch }}
          path: project/build/*.so
