name: Build Misfits Pack Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # arm64-v8a é para celulares modernos, armeabi-v7a para antigos
        arch: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout Misfits Pack
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout GameAPI Dependency
        uses: actions/checkout@v4
        with:
          repository: Rubberduckycooly/Sonic-Mania-Decompilation
          path: mania-decomp

      - name: Setup GameAPI Structure
        run: |
          # O CMake espera encontrar GameAPI/C/GameAPI/Game.c dentro da pasta do projeto
          mkdir -p project/GameAPI
          cp -r mania-decomp/GameAPI/C project/GameAPI/
          
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile with CMake
        run: |
          cd project
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MisfitsPack-Android-${{ matrix.arch }}
          path: project/build/*.so
